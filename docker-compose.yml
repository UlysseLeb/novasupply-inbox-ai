services:
  # n8n auto-hébergé : orchestre le workflow (Gmail Trigger -> nos 4 endpoints
  # Next.js -> décision -> CRM/brouillon). Recommandé par le brief car open
  # source et auto-hébergeable, contrairement à une solution SaaS fermée.
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Désactive l'authentification basique pour la démo locale uniquement —
      # à activer en production (N8N_BASIC_AUTH_ACTIVE=true).
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
